# The Workflow By GruntFish & DS & DB.
name: Fetch-repos
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源仓库地址（格式:所有者/仓库名）'
        required: true
        type: string
      source_branch:
        description: '源仓库分支（留空使用其默认分支）'
        required: false
        type: string
      source_path:
        description: '源指定路径（目录或文件，可为空，为空=整个仓库）'
        required: false
        type: string
      source_type:
        description: '同步类型'
        required: true
        type: choice
        default: 'auto'
        options:
        - auto
        - file
        - directory
      target_branch:
        description: '保存到的目标分支（不可为空）'
        required: true
        type: string
      target_folder:
        description: '保存到的目标目录'
        required: true
        type: string
      save_to_root:
        description: '保存到根目录：勾选则直接存到目标分支根目录，target_folder作为顶层文件夹名；不勾选则放在target_folder目录内'
        required: false
        type: boolean
        default: false
      flat_copy:
        description: '是否平铺：勾选则直接把源内文件放到目标路径，不嵌套源仓库名字文件夹'
        required: false
        type: boolean
        default: false
      confirm_replace:
        description: '是否替换整个目标目录：勾选则先删除整个目标目录再写入；不勾选则复用已有目录，直接放入文件'
        required: false
        type: boolean
        default: false
      clean_git_meta:
        description: '清理git元文件：勾选后自动删除复制出来内容里的.git和.gitmodules'
        required: false
        type: boolean
        default: true

jobs:
  fetch-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 当前目标仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: 拉取源仓库代码
        run: |
          git clone --depth 1 --branch ${{ inputs.source_branch || '' }} https://github.com/${{ inputs.source_repo }}.git source
        continue-on-error: false

      - name: 准备基准目标路径
        id: path_prep
        run: |
          if [[ "${{ inputs.save_to_root }}" == "true" ]]; then
            BASE_TARGET="./${{ inputs.target_folder }}"
          else
            BASE_TARGET="./${{ inputs.target_folder }}"
          fi
          echo "BASE_TARGET=${BASE_TARGET}" >> $GITHUB_OUTPUT
          mkdir -p "${BASE_TARGET}"

      - name: 替换目标目录（仅勾选confirm_replace时执行）
        run: |
          BASE_TARGET="${{ steps.path_prep.outputs.BASE_TARGET }}"
          if [[ "${{ inputs.confirm_replace }}" == "true" ]]; then
            rm -rf "${BASE_TARGET}"
            mkdir -p "${BASE_TARGET}"
          fi

      - name: 执行文件复制（核心逻辑）
        run: |
          set -e
          BASE_TARGET="${{ steps.path_prep.outputs.BASE_TARGET }}"
          SRC_ROOT="./source"
          # 拼接源路径，如果source_path为空则使用整个源仓库根目录
          if [[ -z "${{ inputs.source_path }}" ]]; then
            SRC_ABS="${SRC_ROOT}"
          else
            SRC_ABS="${SRC_ROOT}/${{ inputs.source_path }}"
          fi

          if [[ "${{ inputs.flat_copy }}" == "true" ]]; then
            # 平铺模式：只复制源路径里面所有内容，不带外层文件夹
            cp -r "${SRC_ABS}/"* "${BASE_TARGET}/"
          else
            # 不平铺：把 source_path 本身这个目录完整复制进去
            SRC_DIR_NAME=$(basename "${SRC_ABS}")
            cp -r "${SRC_ABS}" "${BASE_TARGET}/${SRC_DIR_NAME}"
          fi

      - name: 清理Git元文件
        run: |
          BASE_TARGET="${{ steps.path_prep.outputs.BASE_TARGET }}"
          if [[ "${{ inputs.clean_git_meta }}" == "true" ]]; then
            find "${BASE_TARGET}" -name ".git" -type d -exec rm -rf {} +
            find "${BASE_TARGET}" -name ".gitmodules" -delete
          fi

      - name: 提交推送变更
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          # 判断是否有变更，无变更直接退出
          if git diff --cached --quiet; then
            echo "没有文件变更，跳过提交"
            exit 0
          fi
          git commit -m "Sync from ${{ inputs.source_repo }}${{ inputs.source_path && ' / ' || '' }}${{ inputs.source_path }}"
          git push origin ${{ inputs.target_branch }}
