name: Fetch-repos
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源仓库地址（格式:所有者/仓库名）'
        required: true
        type: string
      source_branch:
        description: '源仓库分支（留空使用其默认分支）'
        required: false
        type: string
      source_path:
        description: '源指定路径（目录或文件，可为空）'
        required: false
        type: string
      source_type:
        description: '同步类型'
        required: true
        type: choice
        default: 'auto'
        options:
        - auto
        - file
        - directory
      target_folder:
        description: '保存到的目标目录'
        required: true
        type: string
      save_to_root:
        description: '保存到根目录：勾选则直接存到目标分支根目录，target_folder作为顶层文件夹名；不勾选则放在target_folder目录内'
        required: false
        default: false
        type: boolean
      flat_copy:
        description: '是否平铺：勾选则直接把源内文件放到目标根目录，不嵌套源文件夹'
        required: false
        default: false
        type: boolean
      confirm_replace:
        description: '是否替换整个目标目录：勾选则先删除整个目标目录再写入；不勾选则复用已有目录，直接放入文件'
        required: false
        default: false
        type: boolean
      target_branch:
        description: '提交到的目标分支'
        required: true
        type: string
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
      - name: Fetch and copy files
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_PATH: ${{ inputs.source_path }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          TARGET_FOLDER: ${{ inputs.target_folder }}
          SAVE_TO_ROOT: ${{ inputs.save_to_root }}
          FLAT_COPY: ${{ inputs.flat_copy }}
          CONFIRM_REPLACE: ${{ inputs.confirm_replace }}
        run: |
          set -e
          echo "=== 信息简要 ==="
          echo "源仓库: $SOURCE_REPO"
          echo "源分支: ${SOURCE_BRANCH:-未指定，使用默认分支}"
          echo "源路径: ${SOURCE_PATH:-整个仓库}"
          echo "同步类型: $SOURCE_TYPE"
          echo "保存至根目录: $SAVE_TO_ROOT"
          echo "平铺复制: $FLAT_COPY"
          echo "整目录替换: $CONFIRM_REPLACE"

          repo_name=$(basename "$SOURCE_REPO")
          # 计算最终dst_root，还原原来两套开关组合逻辑
          if [ "$SAVE_TO_ROOT" = "true" ]; then
            if [ "$FLAT_COPY" = "true" ]; then
              # 保存到根 + 平铺：直接放到仓库根目录
              dst_root="."
              echo "路径规则：保存到分支根目录 + 平铺，文件直接放在仓库根"
            else
              # 保存到根 + 不平铺：在仓库根创建源仓库名字文件夹
              dst_root="./$repo_name"
              echo "路径规则：保存到分支根目录，新建源文件夹 $repo_name"
            fi
          else
            if [ "$FLAT_COPY" = "true" ]; then
              # 指定target_folder + 平铺：文件直接放到 target_folder 里面，不再套一层源文件夹
              dst_root="./$TARGET_FOLDER"
              echo "路径规则：保存到 $TARGET_FOLDER，平铺，源内文件直接放入此目录"
            else
              # 指定target_folder + 不平铺：target_folder下面再套一层源仓库名字文件夹
              dst_root="./$TARGET_FOLDER/$repo_name"
              echo "路径规则：保存到 $TARGET_FOLDER/$repo_name"
            fi
          fi
          echo "最终目标路径：$dst_root"

          temp_dir=$(mktemp -d)
          echo "临时目录: $temp_dir"
          echo "开始拉取源仓库..."
          if [ -n "$SOURCE_BRANCH" ]; then
            git clone --depth 1 --branch "$SOURCE_BRANCH" "https://github.com/$SOURCE_REPO.git" "$temp_dir"
          else
            git clone --depth 1 "https://github.com/$SOURCE_REPO.git" "$temp_dir"
          fi

          if [ -n "$SOURCE_PATH" ]; then
            source_item="$temp_dir/$SOURCE_PATH"
            if [ ! -e "$source_item" ]; then
              echo "错误: 路径 '$SOURCE_PATH' 在源仓库中不存在"
              exit 1
            fi
          else
            source_item="$temp_dir"
          fi

          if [ "$SOURCE_TYPE" = "auto" ]; then
            if [ -d "$source_item" ]; then
              real_type="directory"
            else
              real_type="file"
            fi
          else
            real_type="$SOURCE_TYPE"
          fi
          echo "识别同步类型: $real_type"

          # 【核心逻辑 按你要求修改】
          if [ "$CONFIRM_REPLACE" = "true" ]; then
            if [ -e "$dst_root" ]; then
              echo "【替换模式】删除目标目录 $dst_root"
              rm -rf "$dst_root"
            fi
            mkdir -p "$dst_root"
            echo "【替换模式】重建目录完成"
          else
            if [ -e "$dst_root" ]; then
              echo "【普通写入模式】目录 $dst_root 已存在，直接复用目录"
            else
              echo "【普通写入模式】目录 $dst_root 不存在，新建目录"
              mkdir -p "$dst_root"
            fi
          fi

          echo "开始复制文件..."
          if [ "$real_type" = "directory" ]; then
            if command -v rsync >/dev/null; then
              # 不带 --delete，只复制，不删除目标里原有其它文件
              rsync -av "$source_item/" "$dst_root/"
            else
              find "$source_item" -mindepth 1 -exec cp -r {} "$dst_root/" \;
            fi
            rm -rf "$dst_root/.git" "$dst_root/.gitmodules" 2>/dev/null || true
          else
            mkdir -p "$(dirname "$dst_root")"
            cp "$source_item" "$dst_root"
          fi

          echo "权限处理"
          find "$dst_root" -type f \( -name "*.sh" -o -name "*.bash" -o -name "*.py" -o -name "*.pl" -o -name "*.rb" -o -name "*.php" -o -name "*.lua" \) -exec chmod +x {} \; 2>/dev/null || true
          echo "=== 文件处理完成 ==="
          rm -rf "$temp_dir"
      - name: Commit & Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Sync ${{ inputs.source_repo }}" || echo "无变更，跳过提交"
          git push
